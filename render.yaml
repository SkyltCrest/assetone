services:
  - type: web
    name: assetone
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: AssetOne
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      # Render serves the app over HTTPS only; scope the session cookie to
      # secure connections and keep it first-party (lax) so it survives normal
      # top-level navigation on mobile.
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      # Longer idle window so a tab left open on a phone does not silently
      # expire its CSRF token (was the Laravel default of 120 minutes).
      - key: SESSION_LIFETIME
        value: 480
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PERSISTENT
        value: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render's free plan blocks the usual outbound SMTP ports (25/465/587),
      # but not 2525. Mail goes through Brevo's relay on 2525; STARTTLS is
      # negotiated automatically so no MAIL_SCHEME is needed.
      # Dashboard secrets: MAIL_USERNAME (Brevo account email), MAIL_PASSWORD
      # (Brevo SMTP key), MAIL_FROM_ADDRESS (a Brevo-verified sender address).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 2525
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: AssetOne
